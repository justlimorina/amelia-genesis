source /boot/grub/config.cfg

menuentry "Try Amelia (Live Session)" --hotkey=l {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "Amelia Live with Persistence" --hotkey=p {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ persistence
	initrd	@INITRD_LIVE@
}

menuentry "Install Amelia" --hotkey=i {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ amelia.mode=install
	initrd	@INITRD_LIVE@
}

menuentry "Amelia (Safe Graphics)" --hotkey=s {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset vga=normal
	initrd	@INITRD_LIVE@
}

submenu "Utilities" --hotkey=u {
	source /boot/grub/theme.cfg

	if @ENABLE_MEMTEST@; then
		source /boot/grub/memtest.cfg
	fi

	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi

	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Verify Boot Medium Integrity" --hotkey=v {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
}

