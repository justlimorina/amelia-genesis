---
# Partition Module Configuration for Amelia
userSwapChoices:
  - none
  - small
  - suspend
  - file

initialSwapChoice: small

enableLuksAutomatedPartitioning: true
luksGeneration: luks1

defaultFileSystemType: "ext4"
availableFileSystemTypes:
  - "ext4"
  - "btrfs"
  - "xfs"

essentialMounts:
  - "live-*"
  - "control"
  - "ventoy"

efi:
  mountPoint: "/boot/efi"
  recommendedSize: 300MiB
  minimumSize: 300MiB
  label: "EFI"
