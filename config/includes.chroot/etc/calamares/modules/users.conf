---
# Users Module Configuration for Amelia
userGroup: users
defaultGroups:
  - cdrom
  - floppy
  - sudo
  - audio
  - dip
  - video
  - plugdev
  - netdev
  - lpadmin
  - scanner
  - bluetooth
  - nix-users
autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
setRootPassword: false

passwordRequirements:
  nonempty: true
  minLength: 6
  maxLength: -1

