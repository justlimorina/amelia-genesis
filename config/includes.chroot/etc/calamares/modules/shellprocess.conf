---
# Calamares ShellProcess Module for Post-Install Cleanup in Amelia
dontChroot: false
timeout: 60
script:
  - "-rm -f /etc/skel/Desktop/install-amelia.desktop"
  - "-rm -f /home/*/Desktop/install-amelia.desktop"
  - "-rm -f /usr/share/applications/install-amelia.desktop"
  - "-rm -f /etc/sudoers.d/live-user"
  - "-sed -i 's/^AutomaticLogin=user/#AutomaticLogin=user/' /etc/gdm3/custom.conf /etc/gdm3/daemon.conf"
  - "-sed -i 's/^AutomaticLoginEnable=true/#AutomaticLoginEnable=true/' /etc/gdm3/custom.conf /etc/gdm3/daemon.conf"

